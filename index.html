<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Enamorada’s Nails — Agenda tu cita</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#09090b;--ink:#f4f4f5;--mut:#a1a1aa;--line:#27272a;--card:#131316;--acc:#a78bfa;--btn:#7c3aed;--btnk:#fff;--bad:#e5484d;--ok:#3ecf8e;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.5}
.top{background:#000;border-bottom:1px solid #1f1f23;color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{font:700 19px 'Playfair Display',Georgia,serif;letter-spacing:.3px}.logo::before{content:"✦ ";color:#a78bfa}
.tabs{display:flex;gap:6px}
.tab{border:1px solid #3a3a3a;background:transparent;color:#ddd;padding:7px 14px;border-radius:999px;font:500 13px 'Inter',sans-serif;cursor:pointer}
.tab.on{background:#7c3aed;border-color:#7c3aed;color:#fff;font-weight:600}
.wrap{max-width:600px;margin:0 auto;padding:0 16px 48px}
.hero{background:radial-gradient(ellipse at 50% 0%,#2b1459 0%,#09090b 72%);color:#fff;margin:0 -16px 22px;padding:44px 24px 48px;text-align:center}
.eyebrow{letter-spacing:4px;font-size:11px;color:#a78bfa;margin:0 0 12px}
.hero h1{font:700 36px/1.15 'Playfair Display',Georgia,serif;margin:0 0 12px}.hero h1 i{color:#a78bfa}
.hero p.t{color:#bbb;margin:0 auto 22px;max-width:380px;font-size:15px}
h2{font:600 20px 'Playfair Display',Georgia,serif;margin:26px 0 12px;display:flex;align-items:center;gap:10px}
.st{width:26px;height:26px;border-radius:50%;background:var(--btn);color:#fff;font:600 13px 'Inter',sans-serif;display:inline-flex;align-items:center;justify-content:center}
.btn{display:block;width:100%;border:0;background:var(--btn);color:var(--btnk);padding:14px;border-radius:12px;font:600 15px 'Inter',sans-serif;margin-top:14px;cursor:pointer;text-align:center;text-decoration:none}
.btn:disabled{opacity:.5}
.btn.sm{display:inline-block;width:auto;padding:8px 14px;font-size:13px;margin:0;border-radius:10px}
.btn.gh{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.bad{background:var(--bad);color:#fff;border:0}
.btn.wa{background:#1fa855;color:#fff}
.btn.gold{background:#7c3aed;color:#fff;display:inline-block;width:auto;padding:13px 28px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.svl{display:grid;gap:8px}
.sv{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:13px 14px;border-radius:14px;font:500 14px 'Inter',sans-serif;cursor:pointer}
.sv small{display:block;color:var(--mut);font-weight:400;font-size:12px}.sv em{font-style:normal;font-weight:600;color:var(--acc);white-space:nowrap}
.sv.on{border:2px solid var(--acc);padding:12px 13px}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;cursor:pointer;display:block}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.cal-h b{text-transform:capitalize}
.nav{border:1px solid var(--line);background:var(--card);color:var(--ink);width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer}.nav:disabled{opacity:.3}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.dow{font-size:11px;color:var(--mut);font-weight:600;padding:4px 0}
.day{aspect-ratio:1;border:0;border-radius:50%;background:transparent;color:var(--ink);font:500 14px 'Inter',sans-serif;cursor:pointer}
.day:hover:not(:disabled){background:var(--line)}.day.hoy{outline:1px solid var(--acc)}.day.on{background:var(--btn);color:#fff}
.day:disabled{color:var(--mut);opacity:.35;cursor:not-allowed}.day.full:disabled{text-decoration:line-through}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:11px 4px;border-radius:10px;font:500 13px 'Inter',sans-serif;cursor:pointer}
.slot.on{background:var(--btn);color:#fff;border-color:var(--btn)}.slot:disabled{opacity:.35;text-decoration:line-through;cursor:not-allowed}
label{display:block;font-size:12px;font-weight:600;margin:12px 0 5px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}
input,textarea,select{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:11px 12px;font:400 15px 'Inter',system-ui,sans-serif}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--acc)}
.sum{border-left:3px solid var(--acc);background:var(--card);padding:10px 12px;font-size:14px;border-radius:6px;margin-bottom:4px}
.small{font-size:12px;color:var(--mut);margin:6px 0}
.ok{text-align:center}.ok .big{font-size:46px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 13px;border-radius:999px;font:500 13px 'Inter',sans-serif;cursor:pointer}.chip.on{background:var(--btn);color:#fff;border-color:var(--btn)}
.nav2{display:flex;gap:6px;overflow-x:auto;padding:14px 0 10px;scrollbar-width:none}.nav2::-webkit-scrollbar{display:none}
.nav2 button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--mut);padding:9px 14px;border-radius:999px;font:600 13px 'Inter',sans-serif;cursor:pointer}
.nav2 button.on{background:var(--btn);border-color:var(--btn);color:#fff}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;text-align:center;padding:10px 2px}
.stat b{display:block;font:700 22px 'Playfair Display',Georgia,serif;color:var(--acc)}.stat span{font-size:11px;color:var(--mut)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:12px}
.wd{border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:10px;padding:6px 0;font:600 11px 'Inter',sans-serif;cursor:pointer;text-align:center}
.wd b{display:block;font-size:16px;color:var(--ink)}.wd i{font-style:normal;font-size:9px;color:var(--acc)}.wd.on{border-color:var(--acc)}
.dh{font-weight:600;font-size:12px;color:var(--mut);margin:16px 0 6px;text-transform:uppercase;letter-spacing:.6px}
.cita{border-left:4px solid var(--acc)}.cita.pendiente{border-left-color:#e0a030}.cita.confirmada{border-left-color:var(--ok)}.cita.completada{border-left-color:#5aa0ff;opacity:.8}.cita.cancelada{border-left-color:var(--bad);opacity:.5}
.top2{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:14px}
.badge{font-size:11px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--acc);font-weight:600;height:fit-content;white-space:nowrap}
.cita p{margin:3px 0;font-size:13px;color:var(--mut)}.cita p b{color:var(--ink)}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;text-transform:none;letter-spacing:0;color:var(--ink)}.chk input{width:auto}
.prev{background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:10px;font-size:13px;margin-top:10px}
.alert{background:#1d1236;border:1px solid var(--acc);color:#e9ddff;border-radius:14px;padding:12px 14px;margin-bottom:10px;font-size:14px}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.thumbs div{position:relative}.thumbs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block}
.thumbs button{position:absolute;right:4px;top:4px}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}.lb img{max-width:100%;max-height:100%;border-radius:12px}
.pay{border-top:1px solid var(--line);padding:11px 0;display:grid;gap:3px;font-size:14px}.pay:first-of-type{border-top:0;padding-top:0}.pay span{color:var(--mut)}.pay .btn{justify-self:start;margin-top:6px}
.bar{height:8px;border-radius:6px;background:var(--btn);min-width:3px}.rw{display:grid;grid-template-columns:70px 1fr auto;gap:10px;align-items:center;font-size:13px;margin:7px 0}.rw small{color:var(--mut)}
.foot{text-align:center;margin-top:30px;color:var(--mut);font-size:12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:14px;z-index:30;max-width:90%}
.hide{display:none}
</style>
</head>
<body>
<header class="top"><div class="logo" id="logo">Enamorada’s Nails</div><div class="tabs"><button class="tab on" id="tR">Reservar</button><button class="tab" id="tP">Panel</button></div></header>
<main class="wrap"><div id="vR"></div><div id="vP" class="hide"></div></main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, doc, setDoc, updateDoc, deleteDoc, collection, onSnapshot, writeBatch, runTransaction } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

/* ============================================================

   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyDDdrh8JTlPNAa1i5iQMV2mZ7aLyF3eA5I",
  authDomain: "enamorada-s-nails.firebaseapp.com",
  projectId: "enamorada-s-nails",
  storageBucket: "enamorada-s-nails.firebasestorage.app",
  messagingSenderId: "55705065716",
  appId: "1:55705065716:web:b520060955aafefd6e66a1"
};
/* ============================================================ */
const db = getFirestore(initializeApp(firebaseConfig));
const PW_HASH="7930b9d539644f3fd36e685de80939a7f4a4a6a78827f097e77347c7029dc759"; /* clave del panel: 2031 */

const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const P=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"],DIAS=["D","L","M","M","J","V","S"];
const fLarga=s=>P(s).toLocaleDateString("es",{weekday:"long",day:"numeric",month:"long"});
const fCorta=s=>P(s).toLocaleDateString("es",{day:"numeric",month:"short"});
const nextDay=s=>{const d=P(s);d.setDate(d.getDate()+1);return iso(d)};
const mm=t=>{const [h,m]=String(t).split(":").map(Number);return h*60+m};
const key=m=>pad(m/60|0)+":"+pad(m%60);
const h12=t=>{const m=typeof t==="number"?t:mm(t),h=m/60|0;return (h%12||12)+":"+pad(m%60)+" "+(h%24<12?"AM":"PM")};
const durL=d=>d<60?d+" min":(d/60|0)+" h"+(d%60?" "+d%60+" min":"");
const L=n=>+n?"L "+Number(n).toLocaleString("es"):"Consultar";
const wa=(tel,msg)=>{const d=String(tel||"").replace(/\D/g,""),n=d.length===8?"504"+d:d;return "https://wa.me/"+n+(msg?"?text="+encodeURIComponent(msg):"")};
const toast=t=>{const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2800)};
const busy=()=>/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||"");

const DEF={nombre:"Enamorada’s Nails",wa:"50432180318",tag:"Diseños únicos, acabado perfecto y atención con cariño.",abre:7,cierra:20,paso:60,dias:90,rec:10,
 msgConf:"¡Buen día, {nombre}! 💖 Muchas gracias por agendar. Confirmo tu cita para el {fecha} a las {hora} ({servicio}). ¡Te esperamos!",
 msgRec:"¡Hola, {nombre}! ⏰ Te recordamos que tu cita es hoy a las {hora}. ¡Te esperamos en Enamorada’s Nails! 💅"};
const DEFS=["Manicura clásica","Uñas acrílicas","Gel / Semipermanente","Pedicura","Nail art / Diseño","Baño acrílico","Aplicación de polygel"];
const PAGOS=[{banco:"Banco de Occidente",lab:"Número de cuenta",num:"214021250580",tit:"ENAMORADO HERRERA KENSI NEVAI"},{banco:"BAC",lab:"N° de cuenta",num:"750250521",tit:"KENSI NEVAI ENAMORADO HERRERA"}];
const payCard=()=>`<h2>💳 Formas de pago</h2><div class="card"><p style="margin:0 0 12px">Aceptamos <b>efectivo</b> y <b>transferencias</b>.</p>${PAGOS.map((p,i)=>`<div class="pay"><b>${esc(p.banco)}</b><span>${esc(p.lab)}: <b style="color:var(--ink)">${esc(p.num)}</b></span><span>A nombre de: ${esc(p.tit)}</span><button class="btn sm gh" data-cp="${i}">Copiar número</button></div>`).join("")}</div>`;
const bindPay=r=>r.querySelectorAll("[data-cp]").forEach(b=>b.onclick=()=>{const n=PAGOS[+b.dataset.cp].num;(navigator.clipboard?navigator.clipboard.writeText(n):Promise.reject()).then(()=>toast("Número copiado 📋")).catch(()=>toast("Número: "+n))});
const M=n=>"L "+Number(n||0).toLocaleString("es");
const DURS=[30,60,90,120,150,180,240,300];
let cfg={...DEF},servs=[],gal=[],taken=new Set(),ocup=[],allC=[],citas=[],done=null;
let sel={s:null,otro:"",fecha:null,m:null},view=new Date();view.setDate(1);
let unlocked=false,psub="citas",filtro="prox",q="",armed=null;
const fill=(t,c)=>t.replace(/\{(\w+)\}/g,(_,k)=>({nombre:c.nombre,fecha:fLarga(c.fecha),hora:h12(c.hora),servicio:c.servicio}[k]||""));
const nSl=d=>Math.max(1,Math.ceil((d||60)/cfg.paso));
const ids=(f,m,n)=>[...Array(n)].map((_,i)=>f+"_"+key(m+i*cfg.paso));
const allSlots=()=>{const a=[];for(let m=cfg.abre*60;m<cfg.cierra*60;m+=cfg.paso)a.push(m);return a};
const catAll=()=>{const out=[];DEFS.forEach((n,i)=>{const x=servs.find(v=>v.nombre===n);out.push(x?{...x,base:true}:{id:"base"+i,nombre:n,precio:0,dur:60,activo:true,orden:i,base:true})});servs.filter(v=>!DEFS.includes(v.nombre)).forEach(v=>out.push(v));return out.sort((x,y)=>(x.orden||0)-(y.orden||0))};
const catalog=()=>[...catAll().filter(v=>v.activo!==false),{nombre:"Otro",precio:0,dur:60,otro:true}];
function slotsFor(f,n){
  const out=[],now=new Date(),hoy=f===iso(now),nm=now.getHours()*60+now.getMinutes();
  for(let m=cfg.abre*60;m+cfg.paso*n<=cfg.cierra*60;m+=cfg.paso)out.push({m,ok:!(hoy&&m<=nm)&&!ids(f,m,n).some(i=>taken.has(i))});
  return out;
}

/* ================= CLIENTAS ================= */
function renderR(){
  $("#vR").innerHTML=`<section class="hero"><p class="eyebrow">NAIL STUDIO</p><h1>Uñas que hablan <i>por ti</i></h1><p class="t">${esc(cfg.tag)}</p><a class="btn gold" href="#agenda" id="goag">Agendar mi cita</a></section><div id="gal"></div><div id="agenda"></div><div id="bk"></div><div class="foot"><a class="btn wa sm" target="_blank" rel="noopener" href="https://wa.me/${esc(cfg.wa)}">💬 WhatsApp +${esc(cfg.wa)}</a><p>© ${esc(cfg.nombre)} · <a href="#" id="adm" style="color:inherit">Administración</a></p></div>`;
  $("#goag").onclick=e=>{e.preventDefault();$("#agenda").scrollIntoView({behavior:"smooth"})};
  $("#adm").onclick=e=>{e.preventDefault();tab("p")};
  drawGal();drawBook();
}
function drawGal(){
  const el=$("#gal");if(!el)return;
  el.innerHTML=gal.length?`<h2>Nuestros trabajos</h2><div class="gal">${gal.map(g=>`<img src="${g.src}" alt="Trabajo de uñas" loading="lazy">`).join("")}</div>`:"";
  el.querySelectorAll("img").forEach(i=>i.onclick=()=>{$("#lb").innerHTML=`<img src="${i.src}" alt="">`;$("#lb").classList.remove("hide")});
}
$("#lb").onclick=()=>$("#lb").classList.add("hide");
function drawBook(){
  const el=$("#bk");if(!el)return;
  if(done){
    el.innerHTML=`<div class="card ok" style="margin-top:20px"><div class="big">✨</div><h2 style="justify-content:center">¡Cita agendada!</h2><p>${esc(done.servicio)}<br><b>${esc(fLarga(done.fecha))}</b><br>${esc(h12(done.hora))} – ${esc(h12(mm(done.hora)+nSl(done.dur)*cfg.paso))}</p><p class="small">Gracias, ${esc(done.nombre)}. Te esperamos con mucho cariño 💖</p><a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/${esc(cfg.wa)}?text=${encodeURIComponent("Hola, soy "+done.nombre+". Agendé "+done.servicio+" el "+fLarga(done.fecha)+" a las "+h12(done.hora)+" 💅")}">💬 Avisar por WhatsApp</a><button class="btn gh" id="otra">Agendar otra cita</button></div>`;
    el.insertAdjacentHTML("beforeend",payCard());bindPay(el);$("#otra").onclick=()=>{done=null;sel={s:null,otro:"",fecha:null,m:null};drawBook()};return;
  }
  const cat=catalog(),dur=sel.s?sel.s.dur:60,n=nSl(dur);
  let h=`<h2><span class="st">1</span>Elige tu servicio</h2><div class="svl">${cat.map((s,i)=>`<button class="sv ${sel.s&&sel.s.nombre===s.nombre?"on":""}" data-i="${i}"><span>${esc(s.nombre)}<small>⏱ ${durL(s.dur)}</small></span><em>${s.otro?"A consultar":L(s.precio)}</em></button>`).join("")}</div>`;
  if(sel.s&&sel.s.otro)h+=`<label for="otro">¿Qué te quieres hacer?</label><input id="otro" maxlength="80" placeholder="Cuéntanos qué necesitas" value="${esc(sel.otro)}">`;
  h+=`<h2><span class="st">2</span>Elige el día</h2><div class="card"><div id="cal"></div></div>`;
  if(sel.fecha)h+=`<h2><span class="st">3</span>Elige la hora</h2><div class="slots" id="slots"></div><p class="small">${sel.s?"Tu servicio dura "+durL(dur)+".":"Elige un servicio para ver la duración."}</p>`;
  if(sel.fecha&&sel.m!=null)h+=`<h2><span class="st">4</span>Tus datos</h2><div class="sum">${esc(sel.s?sel.s.nombre:"Elige un servicio")} · ${esc(fLarga(sel.fecha))}<br>${esc(h12(sel.m))} – ${esc(h12(sel.m+n*cfg.paso))}${sel.s&&+sel.s.precio?" · "+L(sel.s.precio):""}</div><label for="nom">Tu nombre</label><input id="nom" autocomplete="name" placeholder="Ej. María López"><label for="tel">WhatsApp / Teléfono</label><input id="tel" type="tel" autocomplete="tel" placeholder="Ej. 9999-9999"><label for="nts">Notas (opcional)</label><textarea id="nts" rows="2" placeholder="Color, diseño, inspiración…"></textarea><button class="btn" id="go">Confirmar mi cita</button><p class="small">Pago en efectivo o transferencia (cuentas al final de esta página).</p>`;
  h+=payCard();
  el.innerHTML=h;
  el.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{sel.s=cat[+b.dataset.i];sel.m=null;drawBook()});
  const ot=$("#otro");if(ot)ot.oninput=()=>{sel.otro=ot.value};
  drawCal();drawSlots();bindPay(el);const g=$("#go");if(g)g.onclick=book;
}
function drawCal(){
  const c=$("#cal");if(!c)return;
  const y=view.getFullYear(),m=view.getMonth(),t0=new Date();t0.setHours(0,0,0,0);
  const max=new Date(t0);max.setDate(max.getDate()+cfg.dias);
  const n=new Date(y,m+1,0).getDate(),lead=new Date(y,m,1).getDay(),cur=t0.getFullYear()===y&&t0.getMonth()===m,nn=nSl(sel.s?sel.s.dur:60);
  let h=`<div class="cal-h"><button class="nav" id="pv" ${cur?"disabled":""} aria-label="Mes anterior">‹</button><b>${MESES[m]} ${y}</b><button class="nav" id="nx" aria-label="Mes siguiente">›</button></div><div class="grid">${DIAS.map(d=>`<div class="dow">${d}</div>`).join("")}`;
  for(let i=0;i<lead;i++)h+="<div></div>";
  for(let d=1;d<=n;d++){const dt=new Date(y,m,d),k=iso(dt),full=dt>=t0&&!slotsFor(k,nn).some(s=>s.ok);

function clientas(){

    const past=x.v.filter(c=>c.fecha<hoy||c.estado==="completada").sort((a,b)=>(b.fecha+b.hora).localeCompare(a.fecha+a.hora));

const hrs=()=>{const b=$("#bh1");if(b)b.disabled=$("#bh2").disabled=$("#bd").checked};
function quick(k){
  const t=new Date();let a=new Date(t),b=new Date(t);
  if(k==="sem")b.setDate(b.getDate()+6);
  if(k==="mes"){const base=$("#bf").value?P($("#bf").value):t;a=new Date(Math.max(t,new Date(base.getFullYear(),base.getMonth(),1)));b=new Date(base.getFullYear(),base.getMonth()+1,0);$("#bd").checked=true}

function plan(){
  const f1=$("#bf").value,f2=$("#bt").value||f1,all=$("#bd").checked,sl=allSlots();
  if(!f1)return {err:"Elige el día"};if(f2<f1)return {err:"La fecha final es antes de la inicial"};
  const a=all?sl[0]:+$("#bh1").value,b=all?sl[sl.length-1]:+$("#bh2").value;if(b<a)return {err:"La hora final es antes de la inicial"};

  return {ops,skip,days};
}
function prev(){const e=$("#prev");if(!e)return;const p=plan();e.textContent=p.err?p.err:`Se bloquearán ${p.ops.length} espacio(s) en ${p.days} día(s).`+(p.skip?` ${p.skip} ya estaban ocupados y se respetan.`:"")}

function groupBlocks(){
  const hoy=iso(new Date()),by={},sl=allSlots();
  ocup.filter(o=>o.bloqueo&&o.fecha>=hoy).forEach(o=>{(by[o.fecha]=by[o.fecha]||[]).push({id:o.id,h:mm(o.hora),m:o.motivo||((allC.find(c=>c._id===o.id)||{}).servicio)||"Horario bloqueado"})});
  const days=Object.keys(by).sort().map(f=>{const runs=[];by[f].sort((a,b)=>a.h-b.h).forEach(x=>{const r=runs[runs.length-1];if(r&&r.m===x.m&&x.h===r.to+cfg.paso){r.to=x.h;r.ids.push(x.id)}else runs.push({from:x.h,to:x.h,m:x.m,ids:[x.id]})});return {f,runs,sig:runs.map(r=>r.from+"-"+r.to+"-"+r.m).join("|")}});
  const gs=[];days.forEach(d=>{const g=gs[gs.length-1],ii=d.runs.flatMap(r=>r.ids);if(g&&g.sig===d.sig&&nextDay(g.f2)===d.f){g.f2=d.f;g.n++;g.ids.push(...ii)}else gs.push({f1:d.f,f2:d.f,n:1,sig:d.sig,runs:d.runs,ids:ii})});
  return gs.map(g=>({...g,all:g.runs.length===1&&g.runs[0].from===sl[0]&&g.runs[0].to===sl[sl.length-1]}));
}
function drawBloq(){
  const el=$("#blist");if(!el)return;const gs=groupBlocks();
  if(!gs.length){el.innerHTML=`<div class="card"><p class="small" style="text-align:center;margin:0">No tienes horas bloqueadas 🌸</p></div>`;return}
  el.innerHTML=gs.map((g,i)=>{
    const k=g.f1+g.f2+g.sig,arm=armed===k;
    return `<div class="card cita"><div class="top2"><span>${g.f1===g.f2?esc(fLarga(g.f1)):esc(fCorta(g.f1))+" → "+esc(fCorta(g.f2))}</span><span class="badge">${g.n} día${g.n>1?"s":""}</span></div>${g.runs.map(r=>`<p>${g.all?"Todo el día":esc(h12(r.from))+" – "+esc(h12(r.to+cfg.paso))} · ${esc(r.m)}</p>`).join("")}<div class="acts"><button class="btn sm ${arm?"bad":"gh"}" data-g="${i}">${arm?"¿Seguro? Desbloquear":"Desbloquear"}</button></div></div>`}).join("");
  el.querySelectorAll("[data-g]").forEach(b=>b.onclick=async()=>{
    const g=gs[+b.dataset.g],k=g.f1+g.f2+g.sig;if(armed!==k){armed=k;drawBloq();return}
    try{for(let i=0;i<g.ids.length;i+=200){const w=writeBatch(db);g.ids.slice(i,i+200).forEach(id=>{w.delete(doc(db,"ocupado",id));if(allC.some(c=>c._id===id&&c.bloqueo))w.delete(doc(db,"citas",id))});await w.commit()}armed=null;toast("Horarios desbloqueados ✅")}catch(e){toast("No se pudo desbloquear")}
  });
}

/* ---- Servicios y precios ---- */
function shellServ(){$("#pb").innerHTML=`<p class="small" style="margin-top:0">Aquí cambias el precio y la duración de cada servicio. Se ve al instante en la página de reservas. Los servicios de siempre quedan fijos; solo ajustas su precio.</p><div id="sv"></div><button class="btn" id="svn">+ Agregar servicio</button>`;$("#svn").onclick=()=>setDoc(doc(db,"servicios","s"+Date.now()),{nombre:"Nuevo servicio",precio:0,dur:60,activo:true,orden:Date.now()}).catch(()=>toast("No se pudo agregar"));drawServ()}
function drawServ(){
  const el=$("#sv");if(!el)return;
  el.innerHTML=catAll().map(s=>`<div class="card" data-id="${esc(s.id)}" data-o="${s.orden||0}"><label style="margin-top:0">Nombre</label><input class="n" value="${esc(s.nombre)}" ${s.base?"disabled":""}><div class="row2"><div><label>Precio (L)</label><input class="p" type="number" min="0" inputmode="numeric" value="${+s.precio||0}"></div><div><label>Duración</label><select class="d">${DURS.map(d=>`<option value="${d}" ${+s.dur===d?"selected":""}>${durL(d)}</option>`).join("")}</select></div></div><label class="chk" style="margin-top:12px"><input type="checkbox" class="a" ${s.activo!==false?"checked":""}> Visible para las clientas</label><div class="acts"><button class="btn sm" data-sv="save">Guardar</button>${s.base?"":`<button class="btn sm ${armed===s.id?"bad":"gh"}" data-sv="del">${armed===s.id?"¿Seguro? Eliminar":"Eliminar"}</button>`}</div></div>`).join("");
  el.querySelectorAll("[data-sv]").forEach(b=>b.onclick=async()=>{
    const card=b.closest(".card"),id=card.dataset.id;
    try{
      if(b.dataset.sv==="save"){await setDoc(doc(db,"servicios",id),{nombre:card.querySelector(".n").value.trim()||"Servicio",precio:+card.querySelector(".p").value||0,dur:+card.querySelector(".d").value,activo:card.querySelector(".a").checked,orden:+card.dataset.o||0});toast("Guardado ✅")}
      else if(armed!==id){armed=id;drawServ()}else{await deleteDoc(doc(db,"servicios",id));armed=null;toast("Servicio eliminado")}
    }catch(e){toast("No se pudo guardar")}
  });
}

/* ---- Galería ---- */
const comp=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,900/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext("2d").drawImage(i,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.72))};i.onerror=rej;i.src=r.result};r.onerror=rej;r.readAsDataURL(f)});
function shellGal(){
  $("#pb").innerHTML=`<div class="card"><p class="small" style="margin-top:0">Sube fotos de tus trabajos. Se ven en la página principal. Se reducen solas para cargar rápido.</p><input id="up" type="file" accept="image/*" multiple><div class="prev" id="upm" style="display:none"></div></div><div class="thumbs" id="gA"></div>`;
  $("#up").onchange=async e=>{
    const fs=[...e.target.files],m=$("#upm");m.style.display="block";let ok=0;
    for(const f of fs){m.textContent="Subiendo "+(ok+1)+" de "+fs.length+"…";
      try{const src=await comp(f);if(src.length>950000){toast("Una foto es muy pesada");continue}await setDoc(doc(db,"galeria","g"+Date.now()+ok),{src,creada:Date.now()});ok++}catch(er){toast("No se pudo subir una foto")}}
    m.textContent=ok+" foto(s) subida(s) ✅";e.target.value="";
  };
  drawGalA();
}
function drawGalA(){
  const el=$("#gA");if(!el)return;
  el.innerHTML=gal.length?gal.map(g=>`<div><img src="${g.src}" alt=""><button class="btn sm ${armed===g.id?"bad":"gh"}" data-d="${esc(g.id)}">${armed===g.id?"¿Borrar?":"✕"}</button></div>`).join(""):`<p class="small">Todavía no hay fotos.</p>`;
  el.querySelectorAll("[data-d]").forEach(b=>b.onclick=async()=>{const id=b.dataset.d;if(armed!==id){armed=id;drawGalA();return}try{await deleteDoc(doc(db,"galeria",id));armed=null}catch(e){toast("No se pudo borrar")}});
}

/* ---- Ajustes ---- */
function shellAj(){
  const f=(id,l,v,t="text")=>`<label for="a_${id}">${l}</label><input id="a_${id}" type="${t}" value="${esc(v)}">`;
  const sel_=(id,l,opts,v)=>`<label for="a_${id}">${l}</label><select id="a_${id}">${opts.map(o=>`<option value="${o[0]}" ${+o[0]===+v?"selected":""}>${o[1]}</option>`).join("")}</select>`;
  const hrsO=[...Array(25)].map((_,i)=>[i,h12(i*60)]);
  $("#pb").innerHTML=`<div class="card">${f("nombre","Nombre del negocio",cfg.nombre)}${f("wa","WhatsApp (con código de país)",cfg.wa,"tel")}${f("tag","Frase de bienvenida",cfg.tag)}<div class="row2"><div>${sel_("abre","Abre a las",hrsO.slice(0,23),cfg.abre)}</div><div>${sel_("cierra","Cierra a las",hrsO.slice(1),cfg.cierra)}</div></div>${sel_("paso","Intervalo de horarios",[[30,"Cada 30 min"],[60,"Cada 1 hora"]],cfg.paso)}${f("dias","Días de anticipación para reservar",cfg.dias,"number")}${f("rec","Recordatorio: minutos antes de la cita",cfg.rec,"number")}<label for="a_msgConf">Mensaje de confirmación</label><textarea id="a_msgConf" rows="3">${esc(cfg.msgConf)}</textarea><label for="a_msgRec">Mensaje de recordatorio</label><textarea id="a_msgRec" rows="3">${esc(cfg.msgRec)}</textarea><p class="small">Puedes usar {nombre}, {fecha}, {hora} y {servicio}; se llenan solos.</p><button class="btn" id="asv">Guardar ajustes</button></div>`;
  $("#asv").onclick=async()=>{
    const v=id=>$("#a_"+id).value,ab=+v("abre"),ci=+v("cierra");
    if(ci<=ab)return toast("La hora de cierre debe ser después de la apertura");
    try{await setDoc(doc(db,"config","negocio"),{nombre:v("nombre").trim()||DEF.nombre,wa:v("wa").replace(/\D/g,"")||DEF.wa,tag:v("tag"),abre:ab,cierra:ci,paso:+v("paso"),dias:+v("dias")||90,rec:+v("rec")||10,msgConf:v("msgConf")||DEF.msgConf,msgRec:v("msgRec")||DEF.msgRec});toast("Ajustes guardados ✅")}catch(e){toast("No se pudo guardar")}
  };
}

/* ---- navegación y datos en vivo ---- */
function tab(w){
  $("#tR").classList.toggle("on",w==="r");$("#tP").classList.toggle("on",w==="p");
  $("#vR").classList.toggle("hide",w!=="r");$("#vP").classList.toggle("hide",w!=="p");
  document.body.classList.toggle("admin",w==="p");if(w==="p")renderP();window.scrollTo({top:0});
}
$("#tR").onclick=()=>tab("r");$("#tP").onclick=()=>tab("p");
const soft=()=>{$("#logo").textContent=cfg.nombre;if(!busy()&&!$("#nom")){renderR()}else{drawGal();}};
onSnapshot(doc(db,"config","negocio"),s=>{cfg={...DEF,...(s.data()||{})};soft();if(unlocked&&psub==="citas")drawCitas()},()=>{});
onSnapshot(collection(db,"servicios"),s=>{servs=s.docs.map(d=>({id:d.id,...d.data()}));if(!busy()){drawBook()}refreshP()},()=>{});
onSnapshot(collection(db,"galeria"),s=>{gal=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.creada||0)-(a.creada||0));drawGal();refreshP()},()=>{});
onSnapshot(collection(db,"ocupado"),s=>{ocup=s.docs.map(d=>({id:d.id,...d.data()}));taken=new Set(ocup.map(o=>o.id));drawCal();drawSlots();refreshP()},()=>{});
onSnapshot(collection(db,"citas"),s=>{allC=s.docs.map(d=>({...d.data(),_id:d.id}));citas=allC.filter(c=>!c.bloqueo);refreshP()},()=>{});
renderR();
</script>
