const nSl=d=>Math.max(1,Math.ceil((d||60)/cfg.paso));

const allSlots=()=>{const a=[];for(let m=cfg.abre*60;m<cfg.cierra*60;m+=cfg.paso)a.push(m);return a};
const catAll=()=>{const out=[];DEFS.forEach((n,i)=>{const x=servs.find(v=>v.nombre===n);out.push(x?{...x,base:true}:{id:"base"+i,nombre:n,precio:0,dur:60,activo:true,orden:i,base:true})});servs.filter(v=>!DEFS.includes(v.nombre)).forEach(v=>out.push(v));return out.sort((x,y)=>(x.orden||0)-(y.orden||0))};
const catalog=()=>[...catAll().filter(v=>v.activo!==false),{nombre:"Otro",precio:0,dur:60,otro:true}];
function slotsFor(f,n){
  const out=[],now=new Date(),hoy=f===iso(now),nm=now.getHours()*60+now.getMinutes();
  for(let m=cfg.abre*60;m+cfg.paso*n<=cfg.cierra*60;m+=cfg.paso)out.push({m,ok:!(hoy&&m<=nm)&&!ids(f,m,n).some(i=>taken.has(i))});
  return out;
}

const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
function drawGal(){

  const sig=gal.map(g=>g.id).join();

  const N=gal.length,car=gal.slice(0,8);
  el.innerHTML=`<h2>Nuestros trabajos</h2><div class="folder" id="fold"><div class="ftab" id="ftab">📁 Carpeta · ${N} foto${N>1?"s":""}</div><div class="car" id="car">${car.map((g,i)=>`<img class="ci" data-i="${i}" src="${g.src}" alt="Trabajo de uñas ${i+1}" draggable="false" ${i>1?'loading="lazy"':""}>`).join("")}</div><div class="fdots" id="fdots">${car.map(()=>"<span></span>").join("")}</div><p class="small" style="text-align:center">Desliza ↔ · toca una foto para abrir la carpeta</p><button class="btn gh" id="openf">Abrir carpeta (${N})</button></div>`;
  const cr=$("#car");let tk=0;
  const fx=()=>{tk=0;const b=cr.getBoundingClientRect(),c=b.left+b.width/2;let best=0,bd=9;
    [...cr.children].forEach((im,i)=>{const r=im.getBoundingClientRect(),d=(r.left+r.width/2-c)/b.width,a=Math.min(1,Math.abs(d));
      if(!RM){im.style.transform=`scale(${1-a*.14}) rotateY(${-d*30}deg)`;im.style.opacity=1-a*.45}
      if(a<bd){bd=a;best=i}});
    $$("#fdots span").forEach((x,k)=>x.classList.toggle("on",k===best))};
  cr.onscroll=()=>{if(!tk)tk=requestAnimationFrame(fx)};
  requestAnimationFrame(fx);
  cr.onclick=e=>{if(e.target.closest(".ci"))openAlbum(null)};
  $("#ftab").onclick=$("#openf").onclick=()=>openAlbum(null);
}

function drawCal(){
  const c=$("#cal");if(!c)return;
  const y=view.getFullYear(),m=view.getMonth(),t0=new Date();t0.setHours(0,0,0,0);
  const max=new Date(t0);max.setDate(max.getDate()+cfg.dias);
  const n=new Date(y,m+1,0).getDate(),lead=new Date(y,m,1).getDay(),cur=t0.getFullYear()===y&&t0.getMonth()===m,nn=nSl(sel.s?sel.s.dur:60);
  let h=`<div class="cal-h"><button class="nav" id="pv" ${cur?"disabled":""} aria-label="Mes anterior">‹</button><b>${MESES[m]} ${y}</b><button class="nav" id="nx" aria-label="Mes siguiente">›</button></div><div class="grid">${DIAS.map(d=>`<div class="dow">${d}</div>`).join("")}`;
  for(let i=0;i<lead;i++)h+="<div></div>";
  for(let d=1;d<=n;d++){const dt=new Date(y,m,d),k=iso(dt),full=dt>=t0&&!slotsFor(k,nn).some(s=>s.ok);
    h+=`<button class="day ${k===iso(t0)?"hoy":""} ${sel.fecha===k?"on":""} ${full?"full":""}" data-d="${k}" ${dt<t0||dt>max||full?"disabled":""}>${d}</button>`}
  c.innerHTML=h+"</div>";
  $("#pv").onclick=()=>{view=new Date(y,m-1,1);drawCal()};$("#nx").onclick=()=>{view=new Date(y,m+1,1);drawCal()};
  c.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{sel.fecha=b.dataset.d;sel.m=null;drawBook();setTimeout(()=>{const s=$("#slots");if(s)s.scrollIntoView({behavior:"smooth",block:"center"})},60)});
}
function drawSlots(){
  const s=$("#slots");if(!s||!sel.fecha)return;
  s.innerHTML=slotsFor(sel.fecha,nSl(sel.s?sel.s.dur:60)).map(x=>`<button class="slot ${sel.m===x.m?"on":""}" data-m="${x.m}" ${x.ok?"":"disabled"}>${h12(x.m)}</button>`).join("");
  s.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{sel.m=+b.dataset.m;drawBook();setTimeout(()=>{const g=$("#nom");if(g)g.scrollIntoView({behavior:"smooth",block:"center"})},60)});
}
async function book(){
  const nombre=$("#nom").value.trim(),tel=$("#tel").value.trim(),notas=$("#nts").value.trim();
  if(!sel.s)return toast("Elige un servicio primero");
  if(sel.s.otro&&!sel.otro.trim())return toast("Escribe qué te quieres hacer");
  if(nombre.length<2)return toast("Escribe tu nombre");
  if(tel.replace(/\D/g,"").length<8)return toast("Escribe un teléfono válido");
  if(sel.fecha===iso(new Date())){const n0=new Date();if(sel.m<=n0.getHours()*60+n0.getMinutes())return toast("Esa hora ya pasó, elige otra")}
  const btn=$("#go");btn.disabled=true;btn.textContent="Agendando…";
  const dur=sel.s.dur,n=nSl(dur),all=ids(sel.fecha,sel.m,n),id=all[0];
  const c={nombre:nombre.slice(0,60),tel:tel.slice(0,30),notas:notas.slice(0,300),servicio:sel.s.otro?"Otro: "+sel.otro.trim():sel.s.nombre,precio:+sel.s.precio||0,dur,fecha:sel.fecha,hora:key(sel.m),estado:"pendiente",creada:Date.now()};
  try{
    await runTransaction(db,async tx=>{
      const rs=all.map(i=>doc(db,C("ocupado"),i));
      for(const r of rs)if((await tx.get(r)).exists())throw new Error("taken");
      rs.forEach((r,i)=>tx.set(r,{fecha:sel.fecha,hora:key(sel.m+i*cfg.paso)}));
      tx.set(doc(db,C("citas"),id),c);
    });
    done=c;mineAdd(c);drawBook();window.scrollTo({top:0,behavior:"smooth"});
  }catch(e){
    if(e.message==="taken"){toast("Ese horario ya se ocupó, elige otro");sel.m=null;drawBook()}
    else{console.error(e);toast("No se pudo agendar. Revisa tu internet.");btn.disabled=false;btn.textContent="Confirmar mi cita"}
  }
}

async function sha(t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("enamorada:"+t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}

let gotO=false,gotC=false,synced=false;
async function syncOcupado(){
  if(synced||!unlocked||!gotO||!gotC)return;synced=true;
  const hoy=iso(new Date()),miss=[];
  citas.filter(c=>c.fecha>=hoy&&["pendiente","confirmada"].includes(c.estado)).forEach(c=>cancelIds(c).forEach((id,i)=>{if(!taken.has(id))miss.push([id,{fecha:c.fecha,hora:key(mm(c.hora)+i*cfg.paso)}])}));
  try{for(let i=0;i<miss.length;i+=400){const b=writeBatch(db);miss.slice(i,i+400).forEach(([id,o])=>b.set(doc(db,C("ocupado"),id),o));await b.commit()}}catch(e){synced=false}
}

function dl(c){

const notified=new Set();
const recList=()=>String(cfg.recs||cfg.rec||10).split(",").map(x=>+x.trim()).filter(x=>x>0).sort((a,b)=>b-a);
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.value=.08;o.start();o.stop(a.currentTime+.3)}catch(e){}}
function checkRec(){
  const now=new Date(),hoy=iso(now),nm=now.getHours()*60+now.getMinutes(),rl=recList(),mx=rl[0]||10;
  const due=unlocked?citas.filter(c=>c.fecha===hoy&&["pendiente","confirmada"].includes(c.estado)&&!c.recordado&&mm(c.hora)-nm<=mx&&mm(c.hora)-nm>=-5).sort((a,b)=>a.hora.localeCompare(b.hora)):[];
  let ping=false;
  due.forEach(c=>{const d=mm(c.hora)-nm;rl.forEach(r=>{const k=c._id+"_"+r;if(d<=r&&!notified.has(k)){notified.add(k);ping=true;notify("⏰ Cita en "+Math.max(0,d)+" min",c.nombre+" · "+c.servicio,k)}})});
  if(ping)beep();
  const mine=unlocked?[]:mineGet().filter(c=>c.fecha===hoy&&mm(c.hora)-nm<=mx&&mm(c.hora)-nm>=-5);
  mine.forEach(c=>{const d=mm(c.hora)-nm;rl.forEach(r=>{const k="m"+c.fecha+c.hora+r;if(d<=r&&!notified.has(k)){notified.add(k);notify("⏰ Tu cita es en "+Math.max(0,d)+" min",c.servicio+" · "+h12(c.hora)+" — "+cfg.nombre,k);beep()}})});
  const bar=$("#recbar");bar.classList.toggle("hide",!due.length&&!mine.length);bar.textContent=due.length?"⏰ "+due.length+" cita"+(due.length>1?"s":"")+" por comenzar · toca para ver":mine.length?"⏰ Tu cita es hoy a las "+h12(mine[0].hora):"";
  const el=$("#rec");if(!el)return;
  el.innerHTML=due.map(c=>`<div class="alert">⏰ <b>En ${Math.max(0,mm(c.hora)-nm)} min:</b> ${esc(c.nombre)} · ${esc(h12(c.hora))} · ${esc(c.servicio)}<div class="acts"><a class="btn sm" data-r="${esc(c._id)}" target="_blank" rel="noopener" href="${wa(c.tel,fill(cfg.msgRec,c))}">Enviar recordatorio</a><a class="btn sm gh" href="tel:${esc(String(c.tel).replace(/\D/g,""))}">Llamar</a></div></div>`).join("");

/* ---- Citas ---- */
function shellCitas(){
  $("#pb").innerHTML=`<div class="stats" id="stats"></div><div class="week" id="week"></div><input id="q" type="search" placeholder="🔍 Buscar nombre, teléfono o servicio" value="${esc(q)}" style="margin-bottom:12px"><div class="chips" id="fl"></div><div id="lista"></div>`;
  $("#q").oninput=e=>{q=e.target.value;drawLista()};drawCitas();
}
function drawCitas(){
  if(!$("#stats"))return;
  const hoy=iso(new Date()),act=citas.filter(c=>c.estado!=="cancelada"),wk=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()+i);return iso(d)});
  $("#stats").innerHTML=[["Hoy",act.filter(c=>c.fecha===hoy).length],["Próximas",act.filter(c=>c.fecha>=hoy&&c.estado!=="completada").length],["Pendientes",act.filter(c=>c.estado==="pendiente").length],["7 días",act.filter(c=>wk.includes(c.fecha)).length]].map(s=>`<div class="stat"><b>${s[1]}</b><span>${s[0]}</span></div>`).join("");
  $("#week").innerHTML=wk.map(f=>{const n=act.filter(c=>c.fecha===f).length;return `<button class="wd ${filtro===f?"on":""}" data-f="${f}">${DIAS[P(f).getDay()]}<b>${P(f).getDate()}</b><i>${n?n+(n>1?" citas":" cita"):"·"}</i></button>`}).join("");
  $("#fl").innerHTML=[["prox","Próximas"],["hoy","Hoy"],["pend","Pendientes"],["todas","Todas"]].map(f=>`<button class="chip ${filtro===f[0]?"on":""}" data-f="${f[0]}">${f[1]}</button>`).join("");
  $$("#week [data-f],#fl [data-f]").forEach(b=>b.onclick=()=>{filtro=b.dataset.f;drawCitas()});
  drawLista();

function drawLista(){
  const el=$("#lista");if(!el)return;
  const hoy=iso(new Date());let list=[...citas].sort((a,b)=>(a.fecha+a.hora).localeCompare(b.fecha+b.hora));
  if(/^\d{4}-/.test(filtro))list=list.filter(c=>c.fecha===filtro);
  else if(filtro==="hoy")list=list.filter(c=>c.fecha===hoy&&c.estado!=="cancelada");
  else if(filtro==="prox")list=list.filter(c=>c.fecha>=hoy&&!["cancelada","completada"].includes(c.estado));
  else if(filtro==="pend")list=list.filter(c=>c.estado==="pendiente");
  const t=q.trim().toLowerCase();if(t)list=list.filter(c=>(c.nombre+" "+c.tel+" "+c.servicio).toLowerCase().includes(t));
  if(!list.length){el.innerHTML=`<div class="card"><p class="small" style="text-align:center;margin:0">No hay citas aquí todavía 🌸</p></div>`;return}
  let h="",last="";
  list.forEach(c=>{
    if(c.fecha!==last){last=c.fecha;h+=`<div class="dh">${c.fecha===hoy?"Hoy · ":""}${esc(fLarga(c.fecha))} (${list.filter(x=>x.fecha===c.fecha).length})</div>`}
    const id=c._id,arm=armed===id,act=!["cancelada","completada"].includes(c.estado);
    h+=`<div class="card cita ${esc(c.estado)}"><div class="top2"><span>🕒 ${esc(h12(c.hora))} – ${esc(h12(mm(c.hora)+nSl(c.dur||60)*cfg.paso))}</span><span class="badge">${esc(c.estado)}</span></div><p><b>${esc(c.nombre)}</b> — ${esc(c.servicio)}${+c.precio?" · "+L(c.precio):" · <i>sin precio</i>"}</p><p>📞 ${esc(c.tel)}${c.notas?"<br>📝 "+esc(c.notas):""}</p>`;
    if(act)h+=`<div class="acts">${c.estado==="pendiente"?`<button class="btn sm" data-a="ok" data-id="${esc(id)}">Confirmar</button>`:""}${c.estado==="confirmada"&&c.fecha<=hoy?`<button class="btn sm" data-a="fin" data-id="${esc(id)}">✔ Atendida</button>`:""}<a class="btn sm gh" target="_blank" rel="noopener" href="${wa(c.tel,fill(cfg.msgConf,c))}">WhatsApp</a><a class="btn sm gh" href="tel:${esc(String(c.tel).replace(/\D/g,""))}">Llamar</a><button class="btn sm gh" data-a="pre" data-id="${esc(id)}">💲 Precio</button><button class="btn sm gh" data-a="ext" data-id="${esc(id)}">⏱ +${cfg.paso} min</button><button class="btn sm ${arm?"bad":"gh"}" data-a="no" data-id="${esc(id)}">${arm?"¿Seguro? Cancelar":"Cancelar"}</button></div>`;
    if(c.estado==="completada")h+=`<div class="acts"><button class="btn sm gh" data-a="pre" data-id="${esc(id)}">💲 Precio</button></div>`;
    h+="</div>";
  });
  el.innerHTML=h;
  el.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{
    const id=b.dataset.id,a=b.dataset.a,c=citas.find(x=>x._id===id);if(!c||pending)return;
    const row=[...b.closest(".acts").querySelectorAll("button")];
    if(a==="no"&&armed!==id){armed=id;drawLista();return}
    if(a==="pre"){
      const v=prompt("Precio de esta cita en Lempiras",c.precio||"");if(v===null)return;
      const n=parseFloat(String(v).replace(/[^\d.]/g,""));if(isNaN(n))return toast("Escribe solo números");
      return guard(row,async()=>{await setEstado(c,{precio:n});toast("Precio guardado 💲")});
    }
    if(a==="ok")return guard(row,async()=>{await setEstado(c,{estado:"confirmada"});toast("Cita confirmada ✅")});
    if(a==="fin")return guard(row,async()=>{await setEstado(c,{estado:"completada"});toast("Marcada como atendida 💖")});
    if(a==="ext")return guard(row,async()=>{
      const m=mm(c.hora)+nSl(c.dur||60)*cfg.paso,nid=c.fecha+"_"+key(m),nd=(nSl(c.dur||60)+1)*cfg.paso;
      if(m+cfg.paso>cfg.cierra*60)return toast("Ya es el final del horario");
      if(taken.has(nid))return toast("La siguiente hora ya está ocupada");
      try{
        await runTransaction(db,async tx=>{
          const r=doc(db,C("ocupado"),nid);
          if((await tx.get(r)).exists())throw new Error("taken");
          tx.set(r,{fecha:c.fecha,hora:key(m)});
          tx.update(doc(db,C("citas"),c._id),{dur:nd});
        });
      }catch(e){if(e.message==="taken")return toast("La siguiente hora ya está ocupada");throw e}
      toast("Cita extendida "+cfg.paso+" min ⏱");
    });
    if(a==="no")return guard(row,async()=>{
      const w=writeBatch(db);
      w.update(doc(db,C("citas"),id),{estado:"cancelada"});
      cancelIds(c).forEach(i=>w.delete(doc(db,C("ocupado"),i)));
      await w.commit();armed=null;toast("Cita cancelada, horario libre");
    });
  });
}

/* ---- Clientas ---- */
function clientas(){
  const m={},hoy=iso(new Date());
  citas.filter(c=>c.estado!=="cancelada").forEach(c=>{const k=String(c.tel).replace(/\D/g,"").slice(-8)||c.nombre,x=m[k]=m[k]||{v:[]};x.nombre=c.nombre;x.tel=c.tel;x.v.push(c)});
  return Object.values(m).map(x=>{
    const past=x.v.filter(c=>c.fecha<hoy||c.estado==="completada").sort((a,b)=>(b.fecha+b.hora).localeCompare(a.fecha+a.hora));
    const fut=x.v.filter(c=>c.fecha>=hoy&&c.estado!=="completada").sort((a,b)=>(a.fecha+a.hora).localeCompare(b.fecha+b.hora));
    return {...x,past,ult:past[0],prox:fut[0],gasto:past.reduce((s,c)=>s+(+c.precio||0),0)};
  }).sort((a,b)=>((b.ult||{}).fecha||"").localeCompare((a.ult||{}).fecha||""));
}

function drawIng(){

<div class="stats" style="grid-template-columns:repeat(3,1fr);margin-top:12px"><div class="stat"><b style="font-size:17px">${M(hecho)}</b><span>Ya atendido</span></div><div class="stat"><b style="font-size:17px">${M(total-hecho)}</b><span>Por recibir</span></div><div class="stat"><b style="font-size:17px">${M(prom)}</b><span>Promedio · ${conP.length} con precio</span></div></div>
${pend.length?`<p class="small">⏳ ${pend.length} cita(s) pendiente(s) sin confirmar, no incluidas (${M(sum(pend))}).</p>`:""}${nop?`<p class="small">⚠️ ${nop} cita(s) sin precio: no cuentan en el promedio. Toca “💲 Precio” en la cita para incluirlas.</p>`:""}
<h2>Ingresos por día</h2><div class="card">${days.length?days.map(f=>{const t=sum(by[f]);return `<div class="rw"><small>${f===hoy?"Hoy":esc(P(f).toLocaleDateString("es",{weekday:"short",day:"numeric"}))}</small><div class="bar" style="width:${Math.max(3,t/mx*100)}%"></div><span><b>${M(t)}</b> <small>(${by[f].length})</small></span></div>`}).join(""):`<p class="small" style="margin:0;text-align:center">Aún no hay citas confirmadas este mes 🌸</p>`}</div>
${Object.keys(sv).length?`<h2>Por servicio</h2><div class="card">${Object.entries(sv).sort((a,b)=>b[1]-a[1]).map(([n,t])=>`<div class="rw" style="grid-template-columns:1fr auto"><span>${esc(n)}</span><b>${M(t)}</b></div>`).join("")}</div>`:""}`;

/* ---- Bloqueos ---- */
function shellBloq(){
  const hoy=iso(new Date()),sl=allSlots();
  $("#pb").innerHTML=`<div class="card"><h2 style="margin-top:0">Nuevo bloqueo</h2><p class="small">Bloquea varias horas, varios días o un mes entero en un paso.</p><div class="chips"><button class="chip" data-q="hoy">Hoy</button><button class="chip" data-q="sem">Próximos 7 días</button><button class="chip" data-q="mes">Mes completo</button></div><p class="small">Para otro mes, elige un día de ese mes y toca “Mes completo”.</p><div class="row2"><div><label for="bf">Desde el día</label><input id="bf" type="date" min="${hoy}" value="${hoy}"></div><div><label for="bt">Hasta el día</label><input id="bt" type="date" min="${hoy}" value="${hoy}"></div></div><label class="chk" style="margin-top:12px"><input type="checkbox" id="bd"> Todo el día</label><div class="row2"><div><label for="bh1">Desde la hora</label><select id="bh1">${sl.map(x=>`<option value="${x}">${h12(x)}</option>`).join("")}</select></div><div><label for="bh2">Hasta las</label><select id="bh2">${sl.map((x,i)=>`<option value="${x}" ${i===sl.length-1?"selected":""}>${h12(x+cfg.paso)}</option>`).join("")}</select></div></div><label for="bm">Motivo (opcional)</label><input id="bm" maxlength="60" placeholder="Ej. Vacaciones, compras"><div class="prev" id="prev"></div><button class="btn" id="bgo">🚫 Bloquear</button></div><h2>Bloqueos activos</h2><div id="blist"></div>`;
  $$("#pb input,#pb select").forEach(e=>{e.oninput=prev;e.onchange=()=>{if(e.id==="bf"&&$("#bt").value<e.value)$("#bt").value=e.value;hrs();prev()}});
  $$("[data-q]").forEach(b=>b.onclick=()=>quick(b.dataset.q));
  $("#bgo").onclick=bloquear;hrs();prev();drawBloq();
}
const hrs=()=>{const b=$("#bh1");if(b)b.disabled=$("#bh2").disabled=$("#bd").checked};
function quick(k){
  const t=new Date();let a=new Date(t),b=new Date(t);
  if(k==="sem")b.setDate(b.getDate()+6);
  if(k==="mes"){const base=$("#bf").value?P($("#bf").value):t;a=new Date(Math.max(t,new Date(base.getFullYear(),base.getMonth(),1)));b=new Date(base.getFullYear(),base.getMonth()+1,0);$("#bd").checked=true}
  $("#bf").value=iso(a);$("#bt").value=iso(b);hrs();prev();
}
function plan(){
  const f1=$("#bf").value,f2=$("#bt").value||f1,all=$("#bd").checked,sl=allSlots();
  if(!f1)return {err:"Elige el día"};if(f2<f1)return {err:"La fecha final es antes de la inicial"};
  const a=all?sl[0]:+$("#bh1").value,b=all?sl[sl.length-1]:+$("#bh2").value;if(b<a)return {err:"La hora final es antes de la inicial"};
  const mo=$("#bm").value.trim()||"Horario bloqueado",ops=[];let skip=0,days=0;
  for(let f=f1,n=0;f<=f2&&n<93;f=nextDay(f),n++){days++;for(let m=a;m<=b;m+=cfg.paso){const id=f+"_"+key(m);if(taken.has(id))skip++;else ops.push([id,{fecha:f,hora:key(m),bloqueo:true,motivo:mo}])}}
  return {ops,skip,days};
}
function prev(){const e=$("#prev");if(!e)return;const p=plan();e.textContent=p.err?p.err:`Se bloquearán ${p.ops.length} espacio(s) en ${p.days} día(s).`+(p.skip?` ${p.skip} ya estaban ocupados y se respetan.`:"")}
function bloquear(){
  const p=plan();if(p.err)return toast(p.err);if(!p.ops.length)return toast("Esas horas ya estaban ocupadas");
  return guard([$("#bgo")],async()=>{
    for(let i=0;i<p.ops.length;i+=400){const b=writeBatch(db);p.ops.slice(i,i+400).forEach(([id,o])=>b.set(doc(db,C("ocupado"),id),o));await b.commit()}
    toast(p.ops.length+" espacio(s) bloqueado(s) 🚫");
  },"No se pudo bloquear");
}
function groupBlocks(){
  const hoy=iso(new Date()),by={},sl=allSlots();
  ocup.filter(o=>o.bloqueo&&o.fecha>=hoy).forEach(o=>{(by[o.fecha]=by[o.fecha]||[]).push({id:o.id,h:mm(o.hora),m:o.motivo||((allC.find(c=>c._id===o.id)||{}).servicio)||"Horario bloqueado"})});
  const days=Object.keys(by).sort().map(f=>{const runs=[];by[f].sort((a,b)=>a.h-b.h).forEach(x=>{const r=runs[runs.length-1];if(r&&r.m===x.m&&x.h===r.to+cfg.paso){r.to=x.h;r.ids.push(x.id)}else runs.push({from:x.h,to:x.h,m:x.m,ids:[x.id]})});return {f,runs,sig:runs.map(r=>r.from+"-"+r.to+"-"+r.m).join("|")}});
  const gs=[];days.forEach(d=>{const g=gs[gs.length-1],ii=d.runs.flatMap(r=>r.ids);if(g&&g.sig===d.sig&&nextDay(g.f2)===d.f){g.f2=d.f;g.n++;g.ids.push(...ii)}else gs.push({f1:d.f,f2:d.f,n:1,sig:d.sig,runs:d.runs,ids:ii})});
  return gs.map(g=>({...g,all:g.runs.length===1&&g.runs[0].from===sl[0]&&g.runs[0].to===sl[sl.length-1]}));
}
function drawBloq(){
  const el=$("#blist");if(!el)return;const gs=groupBlocks();
  if(!gs.length){el.innerHTML=`<div class="card"><p class="small" style="text-align:center;margin:0">No tienes horas bloqueadas 🌸</p></div>`;return}
  el.innerHTML=gs.map((g,i)=>{
    const k=g.f1+g.f2+g.sig,arm=armed===k;
    return `<div class="card cita"><div class="top2"><span>${g.f1===g.f2?esc(fLarga(g.f1)):esc(fCorta(g.f1))+" → "+esc(fCorta(g.f2))}</span><span class="badge">${g.n} día${g.n>1?"s":""}</span></div>${g.runs.map(r=>`<p>${g.all?"Todo el día":esc(h12(r.from))+" – "+esc(h12(r.to+cfg.paso))} · ${esc(r.m)}</p>`).join("")}<div class="acts"><button class="btn sm ${arm?"bad":"gh"}" data-g="${i}">${arm?"¿Seguro? Desbloquear":"Desbloquear"}</button></div></div>`}).join("");
  el.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{
    if(pending)return;
    const g=gs[+b.dataset.g],k=g.f1+g.f2+g.sig;if(armed!==k){armed=k;drawBloq();return}
    guard([b],async()=>{
      for(let i=0;i<g.ids.length;i+=200){const w=writeBatch(db);g.ids.slice(i,i+200).forEach(id=>{w.delete(doc(db,C("ocupado"),id));if(allC.some(c=>c._id===id&&c.bloqueo))w.delete(doc(db,C("citas"),id))});await w.commit()}
      armed=null;toast("Horarios desbloqueados ✅");
    },"No se pudo desbloquear");
  });
}

    if(b.dataset.sv==="save")return guard(row,async()=>{await setDoc(doc(db,C("servicios"),id),{nombre:card.querySelector(".n").value.trim()||"Servicio",precio:+card.querySelector(".p").value||0,dur:+card.querySelector(".d").value,activo:card.querySelector(".a").checked,orden:+card.dataset.o||0});toast("Guardado ✅")},"No se pudo guardar");
    if(armed!==id){armed=id;drawServ();return}
    return guard(row,async()=>{await deleteDoc(doc(db,C("servicios"),id));armed=null;toast("Servicio eliminado")},"No se pudo eliminar");
  });
}

/* ---- Galería ---- */
const comp=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,900/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext("2d").drawImage(i,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.72))};i.onerror=rej;i.src=r.result};r.onerror=rej;r.readAsDataURL(f)});
function shellGal(){
  $("#pb").innerHTML=`<div class="card"><p class="small" style="margin-top:0">Sube fotos de tus trabajos. Se ven en la página principal. Se reducen solas para cargar rápido.</p><input id="up" type="file" accept="image/*" multiple><div class="prev" id="upm" style="display:none"></div></div><div class="thumbs" id="gA"></div>`;
  $("#up").onchange=async e=>{
    const fs=[...e.target.files],m=$("#upm");m.style.display="block";let ok=0;
    for(const f of fs){m.textContent="Subiendo "+(ok+1)+" de "+fs.length+"…";
      try{const src=await comp(f);if(src.length>950000){toast("Una foto es muy pesada");continue}await setDoc(doc(db,C("galeria"),"g"+Date.now()+ok),{src,creada:Date.now()});ok++}catch(er){toast("No se pudo subir una foto")}}
    m.textContent=ok+" foto(s) subida(s) ✅";e.target.value="";
  };
  drawGalA();
}
function drawGalA(){
  const el=$("#gA");if(!el)return;
  el.innerHTML=gal.length?gal.map(g=>`<div><img src="${g.src}" alt=""><button class="btn sm ${armed===g.id?"bad":"gh"}" data-d="${esc(g.id)}">${armed===g.id?"¿Borrar?":"✕"}</button></div>`).join(""):`<p class="small">Todavía no hay fotos.</p>`;
  el.querySelectorAll("[data-d]").forEach(b=>b.onclick=async()=>{const id=b.dataset.d;if(armed!==id){armed=id;drawGalA();return}try{await deleteDoc(doc(db,C("galeria"),id));armed=null}catch(e){toast("No se pudo borrar")}});
}

/* ---- Ajustes ---- */
function shellAj(){
  const f=(id,l,v,t="text")=>`<label for="a_${id}">${l}</label><input id="a_${id}" type="${t}" value="${esc(v)}">`;
  const sel_=(id,l,opts,v)=>`<label for="a_${id}">${l}</label><select id="a_${id}">${opts.map(o=>`<option value="${o[0]}" ${+o[0]===+v?"selected":""}>${o[1]}</option>`).join("")}</select>`;
  const hrsO=[...Array(25)].map((_,i)=>[i,h12(i*60)]);
  $("#pb").innerHTML=`<div class="card">${f("nombre","Nombre del negocio",cfg.nombre)}${f("wa","WhatsApp (con código de país)",cfg.wa,"tel")}${f("tag","Frase de bienvenida",cfg.tag)}<div class="row2"><div>${sel_("abre","Abre a las",hrsO.slice(0,23),cfg.abre)}</div><div>${sel_("cierra","Cierra a las",hrsO.slice(1),cfg.cierra)}</div></div>${sel_("paso","Intervalo de horarios",[[30,"Cada 30 min (recomendado)"]],cfg.paso)}${f("dias","Días de anticipación para reservar",cfg.dias,"number")}${f("recs","Recordatorios: minutos antes de la cita (ej. 30,10)",cfg.recs||cfg.rec)}<label for="a_msgConsulta">Mensaje del botón de WhatsApp (consultas)</label><textarea id="a_msgConsulta" rows="3">${esc(cfg.msgConsulta||DEF.msgConsulta)}</textarea><label for="a_msgConf">Mensaje de confirmación</label><textarea id="a_msgConf" rows="3">${esc(cfg.msgConf)}</textarea><label for="a_msgRec">Mensaje de recordatorio</label><textarea id="a_msgRec" rows="3">${esc(cfg.msgRec)}</textarea><p class="small">Puedes usar {nombre}, {fecha}, {hora} y {servicio}; se llenan solos.</p><label for="a_pagos">Cuentas de pago (una por línea: Banco | N° de cuenta | Titular)</label><textarea id="a_pagos" rows="3">${esc(pg().map(p=>[p.banco,p.num,p.tit].join(" | ")).join("\n"))}</textarea><button class="btn" id="asv">Guardar ajustes</button></div>`;
  $("#asv").onclick=()=>{
    const v=id=>$("#a_"+id).value,ab=+v("abre"),ci=+v("cierra");
    if(ci<=ab)return toast("La hora de cierre debe ser después de la apertura");
    return guard([$("#asv")],async()=>{await setDoc(doc(db,C("config"),"negocio"),{nombre:v("nombre").trim()||DEF.nombre,wa:v("wa").replace(/\D/g,"")||DEF.wa,tag:v("tag"),abre:ab,cierra:ci,paso:+v("paso"),dias:+v("dias")||90,recs:v("recs").replace(/[^\d,]/g,"")||"30,10",msgConsulta:v("msgConsulta")||DEF.msgConsulta,v2:true,pagos:v("pagos").split("\n").map(l=>l.split("|").map(x=>x.trim())).filter(a=>a[0]&&a[1]).map(a=>({banco:a[0],lab:"N° de cuenta",num:a[1],tit:a[2]||""})),...(cfg.pw?{pw:cfg.pw}:{}),msgConf:v("msgConf")||DEF.msgConf,msgRec:v("msgRec")||DEF.msgRec});toast("Ajustes guardados ✅")},"No se pudo guardar");
  };
}

/* ---- navegación y datos en vivo ---- */
function tab(w){
  $("#tR").classList.toggle("on",w==="r");$("#tP").classList.toggle("on",w==="p");
  $("#vR").classList.toggle("hide",w!=="r");$("#vP").classList.toggle("hide",w!=="p");
  document.body.classList.toggle("admin",w==="p");if(w==="p")renderP();window.scrollTo({top:0});
}
$("#tR").onclick=()=>tab("r");$("#tP").onclick=()=>tab("p");
const soft=()=>{$("#logo").textContent=cfg.nombre;document.title=cfg.nombre+" — Agenda tu cita";if(!busy()&&!$("#nom")){renderR()}else{drawGal();}};
onSnapshot(doc(db,C("config"),"negocio"),s=>{const dd=s.data()||{};cfg={...DEF,...dd};cfg.paso=30;soft();if(unlocked&&psub==="citas")drawCitas()},()=>{});
onSnapshot(collection(db,C("servicios")),s=>{servs=s.docs.map(d=>({id:d.id,...d.data()}));if(!busy()){drawBook()}refreshP()},()=>{});
onSnapshot(collection(db,C("galeria")),s=>{gal=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.creada||0)-(a.creada||0));drawGal();refreshP()},()=>{});
onSnapshot(collection(db,C("ocupado")),s=>{ocup=s.docs.map(d=>({id:d.id,...d.data()}));taken=new Set(ocup.map(o=>o.id));gotO=true;drawCal();drawSlots();refreshP()},()=>{});
onSnapshot(collection(db,C("citas")),s=>{allC=s.docs.map(d=>({...d.data(),_id:d.id}));citas=allC.filter(c=>!c.bloqueo);gotC=true;refreshP()},()=>{});
addEventListener("offline",()=>toast("Sin internet: los cambios no se guardarán"));addEventListener("online",()=>toast("Conexión recuperada ✅"));addEventListener("keydown",e=>{if(e.key==="Escape")closeLb()});
renderR();setTimeout(checkRec,1500);
</script>
